<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- META DATA -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="Description" content="Law Firm Dashboard">
    <meta name="Author" content="Your Name">
    <meta name="keywords" content="law, dashboard, admin panel, responsive">

    <!-- TITLE -->
    <title>Adv. Ganesh</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <!-- CUSTOM CSS -->
    <style>
        /* Header Styles */
        .app-header {
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .hamburger {
            font-size: 24px;
            cursor: pointer;
            display: none;
        }

        /* Sidebar Styles */
        .app-sidebar {
            position: fixed;
            left: -250px;
            top: 0;
            width: 250px;
            height: 100%;
            background-color: #343a40;
            color: white;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .app-sidebar.active {
            left: 0;
        }

        li {
            list-style-type: none;
            font-size: 1.2rem;
        }

        .app-sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
        }

        .main-content {
            margin-left: 0;
            padding: 20px;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .header-content-right {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }

            .app-sidebar {
                width: 200px;
            }
        }

        @media (min-width: 769px) {
            .main-content {
                margin-left: 250px;
            }

            .app-sidebar {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-logo">
                <h1>Adv. Ganesh</h1>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </header>
        <!-- END HEADER -->

        <!-- SIDEBAR -->
        <aside class="app-sidebar" id="sidebar">
            <div class="header-logo">
                <h2 style="text-align:center; padding-top: 2rem;">Adv. Ganesh</h2>
            </div>
            <nav class="main-menu-container">
                <ul class="main-menu">
                    <li><a href="dashboard.html">Dashboards</a></li>
                    <li><a href="Banner.html">Banner Image</a></li>
                    <li><a href="blogcreates.html">Blog</a></li>
                    <li><a href="Vedio.html">Video Gallery</a></li>
                    <li><a href="image.html">Image Gallery</a></li>
                    <li><a href="Review.html">Add Review</a></li>
                </ul>
            </nav>
        </aside>
        <!-- END SIDEBAR -->

        <!-- MAIN CONTENT -->
        <div class="main-content app-content">
            <div class="container-fluid">
                <!-- PAGE HEADER -->
                <div class="d-md-flex d-block align-items-center justify-content-between my-4 page-header-breadcrumb">
                    <div>
                        <p class="fw-semibold fs-18 mb-0">Welcome back, Advocate Ganesh</p>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="table-responsive">
                    <table class="table card-table table-vcenter text-nowrap" id="topDealTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be populated here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- END MAIN CONTENT -->

        <!-- JavaScript -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Fetch data from the getcontact.php API
                fetch('https://advocategvadmin.advgvdeshmukh.com/getcontact.php')
                    .then(response => response.json())
                    .then(data => {
                        const tableBody = document.querySelector('#topDealTable tbody');
                        tableBody.innerHTML = ''; // Clear any existing data

                        if (data.success) {
                            data.data.forEach(item => {
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${item.name}</td>
                                    <td>${item.email}</td>
                                    <td>${item.message}</td>
                                    <td>
                                        <a href="javascript:void(0);" onclick="deleteItem(${item.id})" class="btn-delete">
                                            <p class="btn btn-danger btn-wave">Delete</p>
                                        </a>
                                    </td>
                                `;
                                tableBody.appendChild(row);
                            });
                        } else {
                            const row = document.createElement('tr');
                            row.innerHTML = `<td colspan="4">${data.message}</td>`;
                            tableBody.appendChild(row);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                    });

                // Sidebar toggle functionality
                document.getElementById('hamburger').addEventListener('click', function () {
                    document.getElementById('sidebar').classList.toggle('active');
                });
            });

            function deleteItem(id) {
                if (confirm('Are you sure you want to delete this item?')) {
                    fetch('https://advocategvadmin.advgvdeshmukh.com/delcontact.php', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ id: id })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // alert('Item deleted successfully.');
                            // Optionally, you might want to refresh the table data after deletion
                            location.reload(); // Refreshes the page to get the updated data
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting item:', error);
                    });
                }
            }
        </script>
    </div>
</body>
</html>
