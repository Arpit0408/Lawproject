<script>
  document.getElementById('uploadForm').addEventListener('submit', function(e) {

    const formData = new FormData();
    const videoFile = document.getElementById('inputGroupFile01').files[0];
    
    if (videoFile) {
        formData.append('video_file', videoFile);
        
        fetch('https://advocategvadmin.advgvdeshmukh.com/vedio.php', {
    method: 'POST',
    body: formData
})
.then(response => response.text())  // Use text() to capture the entire response
.then(text => {
    console.log('Response Text:', text);  // Log the raw response for debugging
    try {
        const data = JSON.parse(text);  // Try to parse as JSON
        if (data.success) {
            // alert('Video uploaded successfully!');
        } else {
            alert('Failed to upload video: ' + data.message);
        }
    } catch (error) {
        console.error('Parsing error:', error);
        alert('Received unexpected response from the server.');

})
.catch(error => {

    alert('An error occurred while uploading the video.');
});
    } else {

});

<div class="table-responsive">
    <table class="table text-nowrap">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Created On</th>
                <th scope="col">File Path</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody id="videoTableBody">
            <!-- Data from the API will be inserted here -->
        </tbody>
    </table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('https://advocategvadmin.advgvdeshmukh.com/vedioselect.php')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const tableBody = document.getElementById('videoTableBody');
                data.data.forEach(video => {
                    const row = document.createElement('tr');

                    // Name
                    const nameCell = document.createElement('th');
                    nameCell.scope = 'row';
                    nameCell.textContent = video.file_name;
                    row.appendChild(nameCell);

                    // Created On (Placeholder for date)
                    const createdOnCell = document.createElement('td');
                    createdOnCell.textContent = video.upload_date; // Replace with actual date if available
                    row.appendChild(createdOnCell);

                    // Number (Placeholder for number)
                    const numberCell = document.createElement('td');
                    numberCell.textContent = video.file_path; // Replace with actual number if available
                    row.appendChild(numberCell);

                    // Status (Delete Button)
                    const statusCell = document.createElement('td');
                    const statusBadge = document.createElement('span');
                    statusBadge.className = 'btn btn-danger btn-wave';
                    statusBadge.textContent = 'Delete';
                    statusBadge.style.cursor = 'pointer';
                    statusBadge.addEventListener('click', function() {
                        deleteVideo(video.id, row); // Pass the video ID and the row element
                    });
                    statusCell.appendChild(statusBadge);
                    row.appendChild(statusCell);

                    // Append row to the table body
                    tableBody.appendChild(row);
                });
            } else {
                console.error('Failed to load data:', data.message);
            }
        })
        .catch(error => console.error('Error fetching data:', error));
});

function deleteVideo(videoId, row) {
    fetch('https://advocategvadmin.advgvdeshmukh.com/vediodel.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ id: videoId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Remove the row from the table
            row.remove();
            // alert(data.message);
        } else {
            console.error('Failed to delete video:', data.message);
        }
    })
    .catch(error => console.error('Error:', error));
}
