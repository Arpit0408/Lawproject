                <script>
                    document.getElementById('uploadForm').addEventListener('submit', function(e) {
                        e.preventDefault(); // Prevent the form from submitting the traditional way
                    
                        const formData = new FormData(this);
                    
                        fetch('https://advocategvadmin.advgvdeshmukh.com/blogadd.php', {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {

                        });
                    });

                    <div class="table-responsive">
                        <table class="table text-nowrap">
                            <thead>
                                <tr>
                                    <th scope="col">Title</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Author</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Created</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody id="blogTableBody">
                                <!-- Data from the API will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                    
                    <script>
                document.addEventListener("DOMContentLoaded", function() {
    fetch('https://advocategvadmin.advgvdeshmukh.com/allblog.php')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const tableBody = document.getElementById('blogTableBody');
                data.data.forEach(blog => {
                    const row = document.createElement('tr');

                    // Title
                    const titleCell = document.createElement('th');
                    titleCell.scope = 'row';
                    titleCell.textContent = blog.title;
                    row.appendChild(titleCell);

                    // Category
                    const categoryCell = document.createElement('td');
                    categoryCell.textContent = blog.category;
                    row.appendChild(categoryCell);

                    // Author
                    const authorCell = document.createElement('td');
                    authorCell.textContent = blog.author;
                    row.appendChild(authorCell);

                    // Email
                    const emailCell = document.createElement('td');
                    emailCell.textContent = blog.author_email;
                    row.appendChild(emailCell);

                    // Created On
                    const createdOnCell = document.createElement('td');
                    createdOnCell.textContent = blog.created_at; // Adjust if necessary
                    row.appendChild(createdOnCell);

                    // Action (Delete Button)
                    const actionCell = document.createElement('td');
                    const deleteButton = document.createElement('span');
                    deleteButton.className = 'btn btn-danger btn-wave';
                    deleteButton.textContent = 'Delete';
                    deleteButton.style.cursor = 'pointer';
                    deleteButton.addEventListener('click', function() {
                        if (confirm('Are you sure you want to delete this blog?')) {
                            deleteBlog(blog.id, row);
                        }
                    });
                    actionCell.appendChild(deleteButton);
                    row.appendChild(actionCell);

                    // Append row to the table body
                    tableBody.appendChild(row);
                });
            } else {
                console.error('Failed to load data:', data.message);
            }
        })
        .catch(error => console.error('Error fetching data:', error));
});

function deleteBlog(blogId, row) {
    fetch('https://advocategvadmin.advgvdeshmukh.com/deleteblog.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ id: blogId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            row.remove(); // Remove the row from the table
            // alert(data.message);
        } else {
            console.error('Failed to delete blog:', data.message);
            alert('Failed to delete blog: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred while deleting the blog.');
    });
}
